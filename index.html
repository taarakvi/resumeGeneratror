<!DOCTYPE html>
<html>
<head>
        <title>form</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    
        <div class="formContainer">
            <h2  style="text-align: center;">generate certificate</h2>
        <div class="form">
            <div class="inputBox">
            <label>name</label>
            <input class="name" type="text" placeholder="name">
            </div>

            <div class="inputBox">
            <label>father name</label>
            <input class="father" type="text" placeholder="father">
            </div>

            <div class="inputBox">
            <label>mother name</label>
            <input class="mother" type="text" placeholder="mother">
            </div>

            <div class="inputBox">
            <label>martial status</label>
            <input class="martial" type="text" placeholder="write">
            </div>
            
        </div>
        <div class="form">
            <div class="inputBox">
            <label>address</label>
            <input class="address" type="text" placeholder="address">
            </div>

            <div class="inputBox">
            <label>city</label>
            <input class="city" type="text" placeholder="city">
            </div>

            <div class="inputBox">
            <label>district</label>
            <input class="district" type="text" placeholder="district">
            </div>

            <div class="inputBox">
            <label>state</label>
            <input class="state" type="text" placeholder="state">
            </div>

        </div>
        <div class="form">
            <div class="inputBox">
            <label>mobile n.</label>
            <input class="phone" type="number" placeholder="+91.00000000">
            </div>
                       
            <div class="inputBox"> 
            <label>email</label>
            <input class="email" type="email" placeholder="email">
            </div>
             <div class="inputBox"> 
            <label>language</label>
            <input class="language" type="text" placeholder="language">
            </div>

            <div class="inputBox"> 
            <label>date of birth</label>
            <input class="dob" type="date">
            </div>

        </div>
<!-- qualification -->
        <div class="form">
            <div class="inputBox">
            <label>high school</label>
            <input class="hSchool" type="text" placeholder="name & board">
            </div>
                       
            <div class="inputBox"> 
            <label>inter</label>
            <input class="inter" type="text" placeholder="name & board">
            </div>

            <div class="inputBox"> 
            <label>graduation</label>
            <input class="graduation" type="text" placeholder="graduation">
            </div>

            <div class="inputBox"> 
            <label>tenchnical</label>
            <input class="Tqualification" type="text" placeholder="tenchnical qualification">
            </div>
        </div>

        <div class="form">
            <div class="inputBox">
            <label>experiance</label>
            <input class="experiance" type="text" placeholder="experiance">
            </div>
                       
            <div class="inputBox"> 
            <label>religion</label>
            <input class="religion" type="text" placeholder="religion">
            </div>

            <div class="inputBox"> 
            <label>nationality</label>
            <input class="nationality" type="text" placeholder="nationality">
            </div>

            <div class="inputBox"> 
            <label>skill</label>
            <input class="skill" type="text" placeholder="skill">
            </div>
        </div>

<!-- personal detail -->
             <div class="form">
            <div class="inputBox">
            <label>gender</label>
            <input class="gender" type="text" placeholder="gender">
            </div>

            <label>religion</label>
            <input class="religion" type="text" placeholder="religion">
            </div>

            <div class="inputBox"> 
            <label>nationality</label>
            <input class="nationality" type="text" placeholder="nationality">
            </div>

            <div class="inputBox"> 
            <label>skill</label>
            <input class="skill" type="text" placeholder="skill">
            </div> -->
        </div>

        <div class="submit">
            <div>
                <label>are you sure this is true</label>
                <input class="checkbox" type="checkbox"> 
            </div>
            <button class="gButton">submit</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
